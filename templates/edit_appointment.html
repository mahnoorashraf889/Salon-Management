<!DOCTYPE html>
<html>
<head>
    <title>Edit Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-body">

<div class="appointment-container">

    <h1 class="appointment-title">Edit Appointment</h1>

    <form method="POST" class="appointment-form">

        <div class="form-group">
            <label class="form-label">Customer</label>
            <select name="customer_id" class="form-select" required>
                {% for customer in customers %}
                <option value="{{ customer.Customer_id }}"
                    {% if appointment.Customer_id == customer.Customer_id %}selected{% endif %}>
                    {{ customer.Name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Staff</label>
            <select name="staff_id" class="form-select" required>
                {% for staff in staff_list %}
                <option value="{{ staff.Staff_id }}"
                    {% if appointment.Staff_id == staff.Staff_id %}selected{% endif %}>
                    {{ staff.Name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-input" value="{{ appointment.Date }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">Time</label>
            <input type="time" name="time" class="form-input" value="{{ appointment.Time }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="Pending" {% if appointment.Status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Completed" {% if appointment.Status == 'Completed' %}selected{% endif %}>Completed</option>
                <option value="Cancelled" {% if appointment.Status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Appointment</button>
            <a href="{{ url_for('admin_appointments') }}" class="btn btn-outline">Back</a>
        </div>

    </form>

</div>

</body>
</html>
