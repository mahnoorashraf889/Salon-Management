<!DOCTYPE html>
<html>
<head>
    <title>Salon Services</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-body">

<div class="services-container">

    <h1 class="services-title">Salon Services (Admin)</h1>

    <div class="services-actions">
        <a href="{{ url_for('add_service') }}" class="btn btn-primary">Add New Service</a>
    </div>

    <div class="table-wrapper">
        <table class="services-table">
            <thead class="table-head">
                <tr class="table-row">
                    <th class="table-header">ID</th>
                    <th class="table-header">Service Name</th>
                    <th class="table-header">Price</th>
                    <th class="table-header">Duration</th>
                    <th class="table-header">Actions</th>
                </tr>
            </thead>

            <tbody class="table-body">
                {% for service in services %}
                <tr class="table-row">
                    <td class="table-cell">{{ service.Service_id }}</td>
                    <td class="table-cell">{{ service.Service_name }}</td>
                    <td class="table-cell">{{ service.Price }}</td>
                    <td class="table-cell">{{ service.Duration }}</td>
                    <td class="table-cell table-actions">
                        <a href="{{ url_for('edit_service', service_id=service.Service_id) }}"
                           class="btn btn-secondary">Edit</a>
                        <a href="{{ url_for('delete_service', service_id=service.Service_id) }}"
                           class="btn btn-danger"
                           onclick="return confirm('Are you sure you want to delete this service?');">
                           Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="services-footer">
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Back</a>
    </div>

</div>

</body>
</html>
