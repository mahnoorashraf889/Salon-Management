<!DOCTYPE html>
<html>
<head>
    <title>Admin - View Appointments</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-body">

<div class="appointments-container">

    <h1 class="appointments-title">All Appointments</h1>

    <nav class="appointments-nav">
        <a href="{{ url_for('admin_dashboard') }}" class="nav-link">Dashboard</a>
        <a href="{{ url_for('logout') }}" class="nav-link nav-link-logout">Logout</a>
    </nav>

    <div class="table-wrapper">
        <table class="appointments-table">

            <thead class="table-head">
                <tr class="table-row">
                    <th class="table-header">ID</th>
                    <th class="table-header">Customer</th>
                    <th class="table-header">Staff</th>
                    <th class="table-header">Date</th>
                    <th class="table-header">Time</th>
                    <th class="table-header">Status</th>
                    <th class="table-header">Actions</th>
                </tr>
            </thead>

            <tbody class="table-body">
                {% for appt in appointments %}
                <tr class="table-row">
                    <td class="table-cell">{{ appt.Appointment_id }}</td>
                    <td class="table-cell">{{ appt.Customer_name }}</td>
                    <td class="table-cell">{{ appt.Staff_name }}</td>
                    <td class="table-cell">{{ appt.Date }}</td>
                    <td class="table-cell">{{ appt.Time }}</td>
                    <td class="table-cell">
                        <span class="status-badge status-{{ appt.Status | lower }}">
                            {{ appt.Status }}
                        </span>
                    </td>
                    <td class="table-cell table-actions">
                        <a href="{{ url_for('edit_appointment', appointment_id=appt.Appointment_id) }}"
                           class="btn btn-secondary">Edit</a>
                        <a href="{{ url_for('delete_appointment', appointment_id=appt.Appointment_id) }}"
                           class="btn btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
